<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Prog 4: Texturing</title>

<link type="text/css" rel="stylesheet" href="rasterize.css">

<script type="text/javascript" src="gl-matrix.js"></script>
<script type="text/javascript" src="rasterize.js"></script>
<script type="text/javascript" src="utils.js"></script>
</head>

<body onload="main();">
    <div style="display: grid; gap: 10px; justify-content: center; align-items: center;">
        <div style="position: relative; width: 512px; height: 512px;">
            <canvas id="myWebGLCanvas" width="512" height="512" style="border: 1px solid black;"></canvas>
            <div id="overlay" style="
                position: absolute;
                top: 10px;
                left: 10px;
                background: rgba(0, 0, 0, 0.7);
                color: white;
                padding: 8px;
                z-index: 100;
                font-family: Arial, sans-serif;
                font-size: 12px;
                border-radius: 5px;">
                <div>FPS: <span id="fpsCounter">0</span></div>
                <div>Rendered Triangles: <span id="numTrianglesRendered">0</span></div>
                <div>Resolution: 512x512</div>
                <div>Culling Mode: <span id="cullingMode">None</span></div>
            </div>
        </div>
        <canvas id="gameCanvas" width="512" height="260" style="border: 1px solid black;"></canvas>
    </div>
</body>



</html>
